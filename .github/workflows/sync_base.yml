name: Tự động đồng bộ dữ liệu Base Workflow

on:
  schedule:
    # Tự động chạy mỗi 30 phút (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công bất cứ lúc nào trên GitHub

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Khởi tạo môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Token KHÔNG nằm trong mã nguồn (repo này công khai). Phải khai báo
      # Secret tên BASE_ACCESS_TOKEN tại:
      #   Settings > Secrets and variables > Actions > New repository secret
      - name: Kiểm tra Secret BASE_ACCESS_TOKEN
        env:
          BASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$BASE_ACCESS_TOKEN" ]; then
            echo "::error::Thiếu Secret BASE_ACCESS_TOKEN. Vào Settings > Secrets and variables > Actions > New repository secret, đặt tên BASE_ACCESS_TOKEN và dán token Base vào."
            exit 1
          fi
          echo "Đã có Secret BASE_ACCESS_TOKEN."

      - name: Đồng bộ dữ liệu từ Base Workflow API
        env:
          BASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
        run: python server.py --sync

      - name: Cam kết & Cập nhật đĩa cache mới lên GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cache_payload.json
          if git diff --staged --quiet; then
            echo "Dữ liệu không có thay đổi mới."
          else
            git commit -m "⚡ Tự động đồng bộ dữ liệu Base Workflow [skip ci]"
            git push
          fi
